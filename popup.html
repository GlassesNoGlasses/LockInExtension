<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lock In</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">Lock In</span>
      <span id="statusPill" class="pill pill--idle">Idle</span>
    </header>

    <section id="session" class="card">
      <div id="timeReadout" class="time">00:00:00</div>
      <div id="timeLabel" class="time-label">Not locked in</div>

      <div id="modeRow" class="mode-row" role="radiogroup" aria-label="Session mode">
        <label class="mode">
          <input type="radio" name="mode" value="stopwatch" checked />
          <span>Stopwatch</span>
        </label>
        <label class="mode">
          <input type="radio" name="mode" value="timer" />
          <span>Timer</span>
        </label>
      </div>

      <div id="durationRow" class="duration-row" hidden>
        <label class="duration">
          <input id="hours" type="number" min="0" max="24" step="1" value="0" inputmode="numeric" aria-label="Hours" />
          <span>hrs</span>
        </label>
        <label class="duration">
          <input id="minutes" type="number" min="0" max="59" step="1" value="30" inputmode="numeric" aria-label="Minutes" />
          <span>min</span>
        </label>
      </div>

      <p id="sessionError" class="error" role="alert" hidden></p>

      <div class="btn-row">
        <button id="startBtn" class="btn btn--primary" type="button">Start</button>
        <div id="scopeRow" class="scope-row" role="group" aria-label="Session scope">
          <button
            class="dot dot--white"
            type="button"
            data-scope="white"
            aria-pressed="false"
            aria-label="Scope: white"
            title="Only untagged sites allowed"
          ></button>
          <button
            class="dot dot--red"
            type="button"
            data-scope="red"
            aria-pressed="false"
            aria-label="Scope: red"
            title="Red-tagged + untagged sites allowed"
          ></button>
          <button
            class="dot dot--green"
            type="button"
            data-scope="green"
            aria-pressed="false"
            aria-label="Scope: green"
            title="Green-tagged + untagged sites allowed"
          ></button>
          <button
            class="dot dot--blue"
            type="button"
            data-scope="blue"
            aria-pressed="false"
            aria-label="Scope: blue"
            title="Blue-tagged + untagged sites allowed"
          ></button>
        </div>
        <button id="pauseBtn" class="btn" type="button" hidden>
          Pause<span id="pauseDot" class="btn-dot" aria-hidden="true"></span>
        </button>
        <button id="resumeBtn" class="btn btn--primary" type="button" hidden>
          Resume<span id="resumeDot" class="btn-dot" aria-hidden="true"></span>
        </button>
        <button id="stopBtn" class="btn btn--quiet" type="button" hidden>Stop</button>
      </div>
    </section>

    <p id="lastSession" class="banner" hidden></p>

    <section id="allowlist" class="card">
      <h2 class="card-title">Allowed while locked in</h2>

      <form id="addForm" class="add-row">
        <select id="entryType" aria-label="Entry type">
          <option value="domain">Domain</option>
          <option value="url">URL</option>
        </select>
        <input
          id="entryValue"
          type="text"
          placeholder="Add or search…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Domain or URL"
        />
        <button id="addBtn" class="btn btn--small" type="submit">Add</button>
      </form>

      <div id="filterRow" class="filter-row" role="group" aria-label="Filter list">
        <button
          class="chip"
          type="button"
          data-type="url"
          aria-pressed="false"
          aria-label="Filter: URL entries"
          title="Show only URLs"
        >
          URLS
        </button>
        <button
          class="chip"
          type="button"
          data-type="domain"
          aria-pressed="false"
          aria-label="Filter: domain entries"
          title="Show only domains"
        >
          DOM
        </button>
        <span class="filter-gap" aria-hidden="true"></span>
        <button
          class="dot dot--red"
          type="button"
          data-tag="red"
          aria-pressed="false"
          aria-label="Filter: red tag"
          title="Show only red-tagged sites"
        ></button>
        <button
          class="dot dot--green"
          type="button"
          data-tag="green"
          aria-pressed="false"
          aria-label="Filter: green tag"
          title="Show only green-tagged sites"
        ></button>
        <button
          class="dot dot--blue"
          type="button"
          data-tag="blue"
          aria-pressed="false"
          aria-label="Filter: blue tag"
          title="Show only blue-tagged sites"
        ></button>
      </div>

      <p id="allowError" class="error" role="alert" hidden></p>

      <ul id="entryList" class="entries"></ul>
      <p id="emptyState" class="empty" hidden>Nothing allowed yet. We REALLY locked in.</p>
    </section>

    <script src="lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
